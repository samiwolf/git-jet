[package]
name = "git-jet-app"
version = "0.1.3"
edition = "2021"
description = "A JetBrains-style Git tool: Tauri desktop application"
authors = ["Git Jet contributors <git-jet@example.com>"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git-jet = { path = "../.." }
