[package]
name = "git-jet"
version = "0.1.2"
edition = "2021"
description = "A JetBrains-style Git tool: standalone desktop application"
authors = ["Git Jet contributors <samiulcsedu22@gmail.com>"]
license = "MIT"
repository = "https://github.com/example/git-jet"

[lib]
name = "git_jet"
crate-type = ["rlib"]

[workspace]
members = ["app/src-tauri"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
